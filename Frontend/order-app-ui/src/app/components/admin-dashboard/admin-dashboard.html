<div class="dashboard-container">
  <header class="header">
    <h2>Admin Dashboard - Product Management</h2>
    <button (click)="logout()" class="btn-logout">Logout</button>
  </header>

  <div *ngIf="message" class="alert-box">
    {{ message }}
  </div>

  <!-- Add New Product Form -->
  <div class="card form-section">
    <h3>Add New Product</h3>
    <form (ngSubmit)="onAddProduct()" class="product-form">
      <input type="text" [(ngModel)]="newProduct.productName" name="productName" placeholder="Product Name" required>
      <input type="number" [(ngModel)]="newProduct.price" name="price" placeholder="Price" required>
      <input type="number" [(ngModel)]="newProduct.stockQuantity" name="stockQuantity" placeholder="Stock Quantity" required>
      <input type="text" [(ngModel)]="newProduct.description" name="description" placeholder="Description">
      <button type="submit" class="btn-add">Add Product</button>
    </form>
  </div>

  <!-- Product Inventory Table -->
  <div class="card table-section">
    <h3>Product Inventory</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Product Name</th>
          <th>Price</th>
          <th>Stock Quantity</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let prod of products">
          <td>{{ prod.id }}</td>
          <td>{{ prod.productName }}</td>
          <td>₹{{ prod.price }}</td>
          <td>{{ prod.stockQuantity }}</td>
          <td>{{ prod.description || '-' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
